name: Generate Admin Password Hash

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate scrypt hash
        env:
          ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
        run: |
          if [ -z "$ADMIN_BOOTSTRAP_PASSWORD" ]; then
            echo "Missing GitHub Actions secret: ADMIN_BOOTSTRAP_PASSWORD"
            exit 1
          fi

          node <<'NODE'
          const crypto = require('node:crypto')

          const password = process.env.ADMIN_BOOTSTRAP_PASSWORD
          const N = 16384
          const r = 8
          const p = 1
          const keyLength = 64
          const maxmem = 32 * 1024 * 1024
          const salt = crypto.randomBytes(16)

          crypto.scrypt(password, salt, keyLength, { N, r, p, maxmem }, (error, derivedKey) => {
            if (error) {
              console.error(error)
              process.exit(1)
            }

            const hash = `ADMIN_PASSWORD_HASH=scrypt$${N}$${r}$${p}$${salt.toString('base64url')}$${derivedKey.toString('base64url')}`
            require('node:fs').writeFileSync('admin-password-hash.txt', hash + '\\n', { mode: 0o600 })
            console.log('Admin password hash generated successfully.')
            console.log('The password itself is never printed.')
          })
          NODE

      - name: Upload hash artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-password-hash
          path: admin-password-hash.txt
          retention-days: 1
